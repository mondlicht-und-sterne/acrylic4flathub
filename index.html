<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acrylicons v1.0</title>
  
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
      color: #eee;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #aaa;
      margin-bottom: 40px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto 40px;
    }
    .icon-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      transition: transform 0.2s;
    }
    .icon-box:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.08);
    }
    .icon-box img { 
      width: 80px; 
      height: 80px; 
      border-radius: 18px; /* macht die Acryl-Bilder rund */
      object-fit: cover;
    }
    .icon-box p {
      margin-top: 12px;
      font-size: 0.9em;
      color: #ccc;
    }
    .download-btn {
      display: inline-block;
      padding: 14px 28px;
      background: #7c3aed;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background: #6d28d9;
    }
  </style>
</head>
<body>

  <h1>Acrylicons v1.0</h1>
  <p class="subtitle">Handgemalte Acryl-Icons für Linux</p>

  <div class="gallery">
    <div class="icon-box">
      <img src="preview/icon1.jpg" alt="Abstrakt">
      <p>Abstrakt</p>
    </div>
    <div class="icon-box">
      <img src="preview/icon2.jpg" alt="Natur">
      <p>Natur</p>
    </div>
    <div class="icon-box">
      <img src="preview/icon3.jpg" alt="Ordner">
      <p>Ordner</p>
    </div>
    <div class="icon-box">
      <img src="preview/icon4.jpg" alt="Download">
      <p>Download</p>
    </div>
    <div class="icon-box">
      <img src="preview/icon5.jpg" alt="Musik">
      <p>Musik</p>
    </div>
    <div class="icon-box">
      <img src="preview/icon6.jpg" alt="Video">
      <p>Video</p>
    </div>
  </div>

  <a href="Acrylicons-v1.0.zip" class="download-btn">⬇ Download v1.0</a>

</body>
</html>
