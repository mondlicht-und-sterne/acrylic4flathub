<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mondstern</title>
<style>
  body{background:#0a0a0a;color:#eee;font-family:system-ui,sans-serif;margin:0;padding:20px}
 .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
 .lang{display:flex;gap:8px}
 .lang div{padding:6px 12px;border:1px solid #333;border-radius:999px;cursor:pointer;font-size:14px}
 .lang div.active{background:#fff;color:#000;border-color:#fff}
 .pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
 .pill{padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;transition:.3s;border:2px solid transparent}
 .pill.active{color:#000;transform:scale(1.05)}
 .content{max-width:700px}
 .title{font-size:32px;font-weight:800;margin-bottom:10px}
 .sub{font-size:18px;line-height:1.6;opacity:.9}
 .sub a{color:#22ff88;text-decoration:none;border-bottom:1px solid #22ff88;padding-bottom:2px}
 .sub a:hover{color:#fff;border-bottom-color:#fff}
</style>
</head>
<body>

<div class="top">
  <div style="font-weight:900;letter-spacing:0.2em">MONDSTERN</div>
  <div class="lang" id="lang"></div>
</div>

<div class="pills" id="pills"></div>
<div class="content">
  <div class="title" id="title"></div>
  <div class="sub" id="sub"></div>
</div>

<script>
const menu = [
  { id:'start', color:'#ff3b45', de:{label:'Startseite', title:'Startseite', sub:'Im Oktober 2018 hatte ich angefangen, Acrylbilder zu malen.'}, en:{label:'Home', title:'Home', sub:'In October 2018 I had started to paint acrylic pictures.'} },
  { id:'acrylicons', color:'#3b82ff', de:{label:'Acrylicons', title:'Acrylicons', sub:'Arbeiten aus Acryl.<br><br>Hier kannst du jetzt so viel schreiben wie du willst.<br><br>Absatz 2: Material ist Acryl auf Leinwand, mit Licht und Transparenz.<br><br>Absatz 3: Format 60x80cm bis 120x150cm.'}, en:{label:'Acrylicons', title:'Acrylicons', sub:'Acrylic works.<br><br>You can now write as much as you want here.<br><br>Second paragraph: Material is acrylic on canvas.'} },
  { id:'notizen', color:'#ffe600', de:{label:'Notizen', title:'Notizen', sub:'Gedanken und Notizen.'}, en:{label:'Notes', title:'Notes', sub:'Thoughts and notes.'} },
  { id:'ausstellungen', color:'#a855f7', de:{label:'Ausstellungen', title:'Ausstellungen', sub:'Wo und wann zu sehen.'}, en:{label:'Exhibitions', title:'Exhibitions', sub:'Where and when.'} },
  { id:'links', color:'#22ff88', de:{label:'Links', title:'Links', sub:`<a href="https://www.instagram.com/mondsternundsterne/" target="_blank" rel="noopener noreferrer">Instagram – mondsternundsterne</a><br><br><a href="https://loops.video/@mondstern/" target="_blank" rel="noopener noreferrer">Loops – @mondstern</a>`}, en:{label:'Links', title:'Links', sub:`<a href="https://www.instagram.com/mondsternundsterne/" target="_blank" rel="noopener noreferrer">Instagram – mondsternundsterne</a><br><br><a href="https://loops.video/@mondstern/" target="_blank" rel="noopener noreferrer">Loops – @mondstern</a> title:'Empfohlene Links', sub:`<a href="https://meissen-kaffeeklappe.de/" target="_blank" rel="noopener noreferrer">Kaffeeklappe</a><br><br>`} }
];

const pillsEl = document.getElementById('pills');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('sub');
const langEl = document.getElementById('lang');

function getLang(){ const u=new URLSearchParams(location.search); return u.get('lang')==='en'?'en':'de'; }
function getPage(){ const u=new URLSearchParams(location.search); return u.get('page')||'start'; }

function render(activeId){
  const lang = getLang();
  const page = activeId || getPage();

  // Lang switch
  langEl.innerHTML='';
  ['de','en'].forEach(l=>{
    const d=document.createElement('div');
    d.textContent=l.toUpperCase();
    d.className = l===lang?'active':'';
    d.onclick=()=>{
      history.pushState({},'',`?lang=${l}&page=${page}`);
      render(page);
    };
    langEl.appendChild(d);
  });

  // Pills
  pillsEl.innerHTML='';
  menu.forEach(m=>{
    const d=document.createElement('div');
    d.className='pill'+(m.id===page?' active':'');
    d.textContent=m[lang].label;
    d.style.borderColor=m.color;
    d.style.color=m.id===page?'#000':m.color;
    d.style.background=m.id===page?m.color:'transparent';
    d.style.boxShadow=m.id===page?`0 0 20px ${m.color}`:'none';
    d.onclick=()=>{ history.pushState({},'',`?lang=${lang}&page=${m.id}`); render(m.id); };
    pillsEl.appendChild(d);
  });

  const active = menu.find(m=>m.id===page)||menu[0];
  titleEl.textContent=active[lang].title;
  titleEl.style.color=active.color;
  subEl.innerHTML=active[lang].sub;
}

render();
window.onpopstate=()=>render();
</script>
</body>
</html>
