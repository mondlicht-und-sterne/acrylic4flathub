<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mondstern</title>
<style>
  body{background:#0a0a0a;color:#eee;font-family:system-ui,sans-serif;margin:0;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.lang{display:flex;gap:8px}
.lang div{padding:6px 12px;border:1px solid #333;border-radius:999px;cursor:pointer;font-size:14px}
.lang div.active{background:#fff;color:#000;border-color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
.pill{padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;transition:.3s;border:2px solid transparent}
.pill.active{color:#000;transform:scale(1.05)}
.content{max-width:700px}
.title{font-size:32px;font-weight:800;margin-bottom:10px}
.sub{font-size:18px;line-height:1.6;opacity:.9}
.sub a{color:#22ff88;text-decoration:none;border-bottom:1px solid #22ff88;padding-bottom:2px}
.sub a:hover{color:#fff;border-bottom-color:#fff}
a.btn-link{display:inline-block;padding:10px 20px;border-radius:999px;border:2px solid #3b82ff;color:#3b82ff!important;text-decoration:none;font-weight:700;transition:.3s}
a.btn-link:hover{background:#3b82ff;color:#000!important;box-shadow:0 0 20px #3b82ff}
  /* Acryl Galerie - Pink */
.acryl-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
.acryl-gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:2px solid #ff5ca1;cursor:pointer;transition:.3s}
.acryl-gallery img:hover{transform:scale(1.03);box-shadow:0 0 20px #ff5ca188}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;justify-content:center;align-items:center}
#lightbox img{max-width:60%;max-height:60%;border-radius:12px;border:2px solid #ff5ca1}
#lightbox.active{display:flex}
</style>
</head>
<body>

<div class="top">
  <div style="font-weight:900;letter-spacing:0.2em">MONDSTERN</div>
  <div class="lang" id="lang"></div>
</div>

<div class="pills" id="pills"></div>
<div class="content">
  <div class="title" id="title"></div>
  <div class="sub" id="sub"></div>
</div>

   en:{label:'Acrylicons',

   en:{label:'Gallery',

  { id:'notizen', color:'#ffe600',

   de:{label:'Ausstellungen', Vinyl.jpg
       title:'Ausstellungen',
       sub:`<div style="position:relative;padding-left:30px;border-left:2px solid #a855f7"><div style="margin-bottom:40px;position:relative"><div style="position:absolute;left:-39px;top:0;width:16px;height:16px;background:#a855f7;border-radius:50%;box-shadow:0 0 10px #a855f7"></div><div style="font-size:14px;opacity:.6">09.10.2026 - 30.10.2026</div><div style="font-size:20px;font-weight:800;margin:4px 0">Änderei – Dresden</div><div style="opacity:.8">Altlöbtau 22, 01159 Dresden<br>Vernissage 09.10.2026, 18:30 Uhr<br>Keine Kinderveranstaltung</div></div><div style="margin-bottom:40px;position:relative"><div style="position:absolute;left:-39px;top:0;width:16px;height:16px;background:#333;border-radius:50%;border:2px solid #a855f7"></div><div style="font-size:14px;opacity:.6">13.10.2025 - 31.01.2026</div><div style="font-size:20px;font-weight:800;margin:4px 0">Kunststall Altnaundorf – Radebeul</div><div style="opacity:.8">Altnaundorf 6, 01445 Radebeul<br>Vernissage 28.09.2025</div></div><div style="margin-bottom:10px;position:relative"><div style="position:absolute;left:-39px;top:0;width:16px;height:16px;background:#333;border-radius:50%;border:2px solid #a855f7"></div><div style="font-size:14px;opacity:.6">2024</div><div style="font-size:20px;font-weight:800;margin:4px 0">Berlin / Meißen / Zwickau</div><div style="opacity:.8">Gruppenausstellungen</div></div></div>`},

  { id:'links', color:'#22ff88',
   de:{label:'Links', 
       title:'Links', 
       sub:`<a href="https://www.instagram.com/mondsternundsterne/" target="_blank" rel="noopener noreferrer">Instagram – mondsternundsterne</a><br><br><a href="https://loops.video/@mondstern/" target="_blank" rel="noopener noreferrer">Loops – @mondstern</a>`},
   en:{label:'Links', 
       title:'Links', 
       sub:`<a href="https://www.instagram.com/mondsternundsterne/" target="_blank" rel="noopener noreferrer">Instagram – mondsternundsterne</a><br><br><a href="https://loops.video/@mondstern/" target="_blank" rel="noopener noreferrer">Loops – @mondstern</a>`} }
];

const pillsEl = document.getElementById('pills');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('sub');
const langEl = document.getElementById('lang');

function getLang(){ const u=new URLSearchParams(location.search); return u.get('lang')==='en'?'en':'de'; }
function getPage(){ const u=new URLSearchParams(location.search); return u.get('page')||'start'; }

function render(activeId){
  const lang = getLang();
  const page = activeId || getPage();
  langEl.innerHTML='';
  ['de','en'].forEach(l=>{
    const d=document.createElement('div');
    d.textContent=l.toUpperCase();
    d.className = l===lang?'active':'';
    d.onclick=()=>{
      history.pushState({},'',`?lang=${l}&page=${page}`);
      render(page);
    };
    langEl.appendChild(d);
  });
  pillsEl.innerHTML='';
  menu.forEach(m=>{
    const d=document.createElement('div');
    d.className='pill'+(m.id===page?' active':'');
    d.textContent=m[lang].label;
    d.style.borderColor=m.color;
    d.style.color=m.id===page?'#000':m.color;
    d.style.background=m.id===page?m.color:'transparent';
    d.style.boxShadow=m.id===page?`0 0 20px ${m.color}`:'none';
    d.onclick=()=>{ history.pushState({},'',`?lang=${lang}&page=${m.id}`); render(m.id); };
    pillsEl.appendChild(d);
  });
  const active = menu.find(m=>m.id===page)||menu[0];
  titleEl.textContent=active[lang].title;
  titleEl.style.color=active.color;
  subEl.innerHTML=active[lang].sub;
}
render();
window.onpopstate=()=>render();
</script>

<div id="lightbox" onclick="this.classList.remove('active')"><img src=""></div>
<script>
function openLB(src){document.querySelector('#lightbox img').src=src;document.getElementById('lightbox').classList.add('active')}
</script>
</body>
</html>
