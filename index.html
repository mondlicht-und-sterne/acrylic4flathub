<div class="player">
        <div class="now-playing">Jetzt läuft: <span id="now-title-album2025">-</span></div>
        <audio id="player-album2025" controls></audio>
      </div>

      <div class="tracklist">
        <div class="track" data-src="2025/track1.mp3" data-title="Track 1">
          <div class="track-title">1. Track 1</div>
          <div class="track-time">Klick für Lyrics</div>
          <div class="lyrics">Text Track 1 hier...</div>
        </div>
        <div class="track" data-src="2025/track2.mp3" data-title="Track 2">
          <div class="track-title">2. Track 2</div>
          <div class="track-time">Klick für Lyrics</div>
          <div class="lyrics">Text Track 2 hier...</div>
        </div>
        <div class="track" data-src="2025/track3.mp3" data-title="Track 3">
          <div class="track-title">3. Track 3</div>
          <div class="track-time">Klick für Lyrics</div>
          <div class="lyrics">Text Track 3 hier...</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
document.querySelectorAll('.release').forEach(album => {
  const albumId = album.dataset.album;
  const player = document.getElementById('player-' + albumId);
  const nowTitle = document.getElementById('now-title-' + albumId);
  const tracks = album.querySelectorAll('.track');

  function playTrack(track) {
    tracks.forEach(t => t.classList.remove('active'));
    track.classList.add('active');
    player.src = track.dataset.src;
    nowTitle.textContent = track.dataset.title;
    player.play();
  }

  tracks.forEach(track => {
    track.onclick = () => playTrack(track);
  });

  player.onended = () => {
    const current = album.querySelector('.track.active');
    const next = current.nextElementSibling;
    if(next && next.classList.contains('track')) {
      playTrack(next);
    }
  };

  // Erstes Lied laden
  if(tracks[0]) playTrack(tracks[0]);
});
</script>
</body>
</html>
